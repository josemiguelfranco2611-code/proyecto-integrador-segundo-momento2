<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Momento 2 - Gestión Dinámica DOM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main-container">
    <h1>Gestión de Datos en Tiempo Real</h1>

    <section class="card">
      <h2>1. Registrar Nuevo Elemento</h2>
      <form id="dataForm">
        <div class="form-group">
          <label for="inputNombre">Nombre / Descripción:</label>
          <input type="text" id="inputNombre" placeholder="Ej. Tarea 1 o Producto A" required>
        </div>

        <div class="form-group">
          <label for="selectCategoria">Categoría:</label>
          <select id="selectCategoria" required>
            <option value="">-- Selecciona una opción --</option>
            <option value="Trabajo">Trabajo</option>
            <option value="Estudio">Estudio</option>
            <option value="Personal">Personal</option>
          </select>
        </div>

        <div class="form-group">
          <label for="inputMonto">Valor / Puntaje / Precio ($):</label>
          <input type="number" id="inputMonto" placeholder="Ej. 50000" min="0" required>
        </div>

        <button type="submit" id="btnGuardar">Guardar Registro</button>
      </form>
    </section>

    <section class="card">
      <h2>2. Filtros de Búsqueda</h2>
      <div class="form-group">
        <label for="selectFiltro">Filtrar por categoría:</label>
        <select id="selectFiltro">
          <option value="Todas">Todas</option>
          <option value="Trabajo">Trabajo</option>
          <option value="Estudio">Estudio</option>
          <option value="Personal">Personal</option>
        </select>
      </div>
    </section>

    <section class="card">
      <h2>3. Resultados en Vivo</h2>
      <p id="resumenConteo">Total de registros: 0</p>
      
      <ul id="listaResultados" class="lista-resultados">
      </ul>
    </section>
  </div>

</body>
</html>
